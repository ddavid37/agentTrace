[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Research system investigating trajectory-aware security for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentTrace" }]
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agenttrace = "agenttrace.demo:main"

[tool.setuptools.packages.find]
include = ["agenttrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
